[package]
name = "mirlo"
version = "0.1.0"
license = "GPL-3.0-or-later"
description = "Local vault for X posts: text, photos, videos and documents saved on your own disk."
authors = ["D4vRAM369"]
repository = "https://github.com/D4vRAM369/Mirlo-desktop"
homepage = "https://github.com/D4vRAM369/Mirlo-desktop"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2.8.4"
tokio = { version = "1", features = ["time"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

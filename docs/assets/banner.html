<!doctype html>
<!-- Fuente del banner del README. Regenerar desde la raíz del proyecto con:
     chromium --headless=new --hide-scrollbars --window-size=1280,400 --force-device-scale-factor=2 \
       --default-background-color=00000000 --screenshot=docs/assets/banner.png docs/assets/banner.html
     Inglés: misma orden con --screenshot=docs/assets/banner-en.png y "file://$PWD/docs/assets/banner.html?lang=en" -->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Atkinson';
    src: url('../../node_modules/@fontsource-variable/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-wght-normal.woff2') format('woff2');
    font-weight: 200 800;
  }
  html, body { margin: 0; background: transparent; }
  .banner {
    box-sizing: border-box;
    width: 1280px;
    height: 400px;
    border-radius: 28px;
    overflow: hidden;
    display: grid;
    grid-template-columns: 300px 1fr;
    align-items: center;
    gap: 44px;
    padding: 0 72px 0 64px;
    background: linear-gradient(180deg, #e6ebf1 0%, #dde3ea 100%);
    color: #18212b;
    font-family: 'Atkinson', system-ui, sans-serif;
  }
  img { width: 300px; height: 300px; display: block; }
  h1 { margin: 0; font-size: 112px; line-height: 1; font-weight: 800; letter-spacing: -0.02em; }
  .tagline { margin: 14px 0 0; font-size: 38px; line-height: 1.2; font-weight: 600; color: #2446c7; }
  .facts { margin: 26px 0 0; font-size: 23px; line-height: 1.45; color: #56636f; max-width: 30em; }
</style>
</head>
<body>
  <div class="banner">
    <img src="../../app-icon.png" alt="">
    <div>
      <h1>Mirlo</h1>
      <p class="tagline" data-en="Your local vault for X posts">Tu bóveda local de posts de X</p>
      <p class="facts" data-en="Text, photos, videos and documents saved to your own disk. No account, no cloud, no telemetry.">Texto, fotos, vídeos y documentos guardados en tu disco. Sin cuenta, sin nube y sin telemetría.</p>
    </div>
  </div>
  <script>
    // banner.html?lang=en → versión en inglés (banner-en.png)
    if (new URLSearchParams(location.search).get('lang') === 'en') {
      document.documentElement.lang = 'en'
      document.querySelectorAll('[data-en]').forEach((el) => (el.textContent = el.dataset.en))
    }
  </script>
</body>
</html>
